[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evopt"
version = "0.1.0"
description = "Enterprise-grade Evolutionary Algorithm Optimizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies =[
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.20.0"
]

[project.optional-dependencies]
dev =[
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
evopt-cli = "evopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evopt"]
